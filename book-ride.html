<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Ride - Ride Hailing App</title>

    <link rel="stylesheet" href="book-ride.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Ride Hailing App</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="customer.html">Dashboard</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Logout</a>
        </nav>
    </header>

    <!-- Booking Form -->
    <main class="booking-container">

        <h2>Book Your Ride</h2>
        <p>Fill in the details below to request a ride.</p>

        <form id="bookingForm">

            <label for="pickup">Pickup Location</label>
            <input
                type="text"
                id="pickup"
                name="pickup"
                placeholder="Enter pickup location"
                required
            >

            <label for="destination">Destination</label>
            <input
                type="text"
                id="destination"
                name="destination"
                placeholder="Enter destination"
                required
            >

            <label for="rideType">Ride Type</label>
            <select id="rideType" required>
                <option value="">Select Ride Type</option>
                <option value="Economy">Economy</option>
                <option value="Standard">Standard</option>
                <option value="Premium">Premium</option>
            </select>

            <label for="date">Pickup Date</label>
            <input
                type="date"
                id="date"
                required
            >

            <label for="time">Pickup Time</label>
            <input
                type="time"
                id="time"
                required
            >

            <button type="submit">Request Ride</button>

        </form>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Ride Hailing App. All Rights Reserved.</p>
    </footer>

    <script src="booking.js"></script>

</body>
</html>
